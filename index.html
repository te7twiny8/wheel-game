<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 لعبة الرهان</title>
<style>
body{
  margin:0;font-family:Arial;background:#1b1b1b;color:#fff;
  text-align:center;direction:rtl
}
h2{margin:10px}
.card{background:#111;margin:8px;padding:10px;border-radius:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.item{
  width:70px;height:70px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;cursor:pointer;border:2px solid #333
}
.item.active{border-color:gold;background:#222}
button,input{
  padding:8px 12px;border-radius:8px;border:none;font-size:14px
}
button{background:#ff9800;color:#000;font-weight:bold}
</style>
</head>

<body>

<h2>🎰 لعبة الرهان</h2>

<div class="card">
💰 كوينز: <b id="coins">1000</b>
</div>

<div class="card">
اكتب قيمة الرهان:
<br>
<input id="bet" type="number" min="1" placeholder="الرهان">
</div>

<div class="card">
اختر حتى <b>6</b> عناصر فقط:
<div class="row" id="items"></div>
<p id="limit" style="color:#ff5252"></p>
</div>

<div class="card">
<button onclick="spin()">🎯 لف</button>
</div>

<div class="card" id="result"></div>

<script>
let coins=1000;
const maxSelect=6;

const itemsData=[
 {icon:"🍓",mult:5},
 {icon:"🐟",mult:5},
 {icon:"🍕",mult:5},
 {icon:"🌽",mult:5},
 {icon:"🥩",mult:10},
 {icon:"🍇",mult:15},
 {icon:"🔥",mult:25},
 {icon:"💎",mult:45}
];

const itemsDiv=document.getElementById("items");
const coinsEl=document.getElementById("coins");
const limitEl=document.getElementById("limit");
const resultEl=document.getElementById("result");

itemsData.forEach((it,i)=>{
 const d=document.createElement("div");
 d.className="item";
 d.innerText=it.icon;
 d.onclick=()=>toggle(d);
 itemsDiv.appendChild(d);
});

function toggle(el){
 const active=document.querySelectorAll(".item.active").length;
 if(el.classList.contains("active")){
   el.classList.remove("active");
   limitEl.innerText="";
 }else{
   if(active>=maxSelect){
     limitEl.innerText="❌ لا يمكن اختيار أكثر من 6";
     return;
   }
   el.classList.add("active");
 }
}

function spin(){
 const bet=parseInt(document.getElementById("bet").value);
 const selected=[...document.querySelectorAll(".item.active")];

 if(!bet || bet<=0) return alert("أدخل رهان صحيح");
 if(bet>coins) return alert("الرهان أكبر من كوينزك");
 if(selected.length===0) return alert("اختر عناصر");
 if(selected.length>maxSelect) return;

 coins-=bet;

 const winItem=itemsData[Math.floor(Math.random()*itemsData.length)];
 const win=selected.some(el=>el.innerText===winItem.icon);

 if(win){
   const prize=bet*winItem.mult;
   coins+=prize;
   resultEl.innerHTML=`🎉 فزت! ${winItem.icon} ×${winItem.mult}<br>+${prize}`;
 }else{
   resultEl.innerHTML=`❌ خسرت<br>العنصر الفائز ${winItem.icon}`;
 }

 coinsEl.innerText=coins;
}
</script>

</body>
</html>
